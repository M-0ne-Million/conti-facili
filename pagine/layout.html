<!doctype html>

<link rel="icon" href="data:,">

@font-face { font-family: "Titillium Web"; font-weight: 600; font-display: swap; src: url("${base}font/titillium-600.woff2") format("woff2"); }
@font-face { font-family: "Titillium Web"; font-weight: 700; font-display: swap; src: url("${base}font/titillium-700.woff2") format("woff2"); }
@font-face { font-family: "Titillium Web"; font-weight: 900; font-display: swap; src: url("${base}font/titillium-900.woff2") format("woff2"); }

<footer>

    <p>© $anno $nome_sito</p>
  </div>
</footer>
