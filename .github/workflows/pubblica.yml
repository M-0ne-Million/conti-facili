# A ogni push su main: test dei calcoli, generazione del sito, copia del sito generato nel ramo gh-pages.
# GitHub Pages pubblica il ramo gh-pages (Settings → Pages → Deploy from a branch → gh-pages, /root):
# un solo editore, quindi niente più README pubblicato al posto del sito.
name: Pubblica sito
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pubblica-conti-facili
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test dei calcoli
        run: node --test
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Genera il sito
        run: python build.py
      - name: Copia il sito nel ramo gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd public
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Sito generato da ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
