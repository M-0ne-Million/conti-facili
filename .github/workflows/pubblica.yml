# A ogni push su main: test dei calcoli, generazione del sito, pubblicazione gratuita su GitHub Pages.
name: Pubblica sito
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Gruppo proprio: non si scontra con il "pages build and deployment" automatico di GitHub.
concurrency:
  group: pubblica-conti-facili
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test dei calcoli
        run: node --test
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Genera il sito
        run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
