# A ogni push su main: test dei calcoli, generazione del sito, pubblicazione gratuita su GitHub Pages.
name: Pubblica sito
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# Gruppo proprio: non si scontra con il "pages build and deployment" automatico di GitHub.
concurrency:
  group: pubblica-conti-facili
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test dei calcoli
        run: node --test
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Genera il sito
        run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      # A ogni push GitHub lancia anche il suo "pages build and deployment", che pubblicherebbe il README sopra il sito.
      # Aspettiamo che finisca, così la nostra pubblicazione arriva per ultima (come quando si lancia il workflow a mano).
      # ponytail: aggiramento; si toglie quando GitHub smette di lanciare quel workflow con Source = GitHub Actions.
      - name: Aspetta la pubblicazione automatica di GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            attivi=$(gh run list -R "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --json name,status \
              --jq '[.[] | select(.name == "pages build and deployment" and .status != "completed")] | length')
            [ "$attivi" = "0" ] && exit 0
            echo "In attesa del workflow automatico di GitHub ($i)..."
            sleep 10
          done
      - id: deploy
        uses: actions/deploy-pages@v4
